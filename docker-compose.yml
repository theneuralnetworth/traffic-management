services:
  xmpp:
    image: prosody/prosody:latest
    platform: linux/amd64
    container_name: xmpp
    ports:
      - "5222:5222"
    environment:
      XMPP_DOMAIN: localhost
      XMPP_USER: |
        trafficlight:password
        vehicle:password
      XMPP_PASSWORD: password
    volumes:
      - prosody_data:/var/lib/prosody
      - ./config/prosody/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro

  tfm:
    build:
      context: .
    container_name: tfm
    environment:
      XMPP_HOST: xmpp
      MQTT_HOST: mqtt

  sumo:
    image: ghcr.io/eclipse-sumo/sumo:latest
    platform: linux/amd64
    container_name: sumo
    command: sumo -c /sumo/sumo.xml
    ports:
      - "8813:8813"
    volumes:
      - ./config/sumo/sumo.xml:/sumo/sumo.xml:ro

  ros:
    build:
      context: .
      dockerfile: Dockerfile.ros
    container_name: ros
    command: sleep infinity
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    tty: true
    stdin_open: true
    volumes:
      - .:/root/workspace

  mqtt:
    image: eclipse-mosquitto:latest
    platform: linux/amd64
    container_name: mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/var/lib/mosquitto

volumes:
  prosody_data:
  mosquitto_data:
