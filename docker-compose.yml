services:
  xmpp:
    image: prosody/prosody:latest
    platform: linux/amd64
    container_name: xmpp
    ports:
      - "5222:5222"
    environment:
      XMPP_DOMAIN: localhost
      XMPP_USER: |
        trafficlight:password
        vehicle:password
      XMPP_PASSWORD: password
    volumes:
      - prosody_data:/var/lib/prosody
      - ./prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro

  tfm:
    build:
      context: .
    image: traffic-management:latest
    container_name: tfm
    environment:
      XMPP_HOST: xmpp

  sumo:
    image: ghcr.io/eclipse-sumo/sumo:latest
    platform: linux/amd64
    container_name: sumo
    command: sumo -c /sumo/sumo.xml
    ports:
      - "8813:8813"
    volumes:
      - ./sumo.xml:/sumo/sumo.xml:ro

  ros:
    image: arm64v8/ros:humble-ros-core
    container_name: ros

volumes:
  prosody_data:
